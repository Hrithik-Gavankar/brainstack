name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'
          file-extension: '.md'
          folder-path: 'docs,examples,platforms,core'

      - name: Validate shell scripts
        run: |
          find . -name "*.sh" -exec shellcheck {} \;

  install-test:
    name: Test Installation (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [cursor, claude-code, vscode-copilot, windsurf, aider, continue-dev]
    steps:
      - uses: actions/checkout@v4

      - name: Run installer
        run: |
          mkdir -p /tmp/test-workspace
          bash install.sh ${{ matrix.platform }} /tmp/test-workspace

      - name: Verify core files
        run: |
          test -f /tmp/test-workspace/.engineer-brain/BRAIN.md || \
            test -f /tmp/test-workspace/.cursor/skills/engineer-brain/BRAIN.md

      - name: Verify scanner is executable
        run: |
          find /tmp/test-workspace -name "scan.sh" -executable | grep -q scan.sh

      - name: Verify doctor script is executable
        run: |
          find /tmp/test-workspace -name "doctor.sh" -executable | grep -q doctor.sh

  scanner-test:
    name: Test Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create test git repo
        run: |
          mkdir -p /tmp/test-workspace/test-repo
          cd /tmp/test-workspace/test-repo
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > file.txt
          git add .
          git commit -m "feat: initial commit"

      - name: Run scanner
        run: |
          bash core/scripts/scan.sh /tmp/test-workspace 7
